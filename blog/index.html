<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Tools - News & Updates</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        .blog-container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        
        /* CARD STYLING */
        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
        }
        .post-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        
        .post-meta { 
            font-size: 12px; color: var(--text-dim); margin-bottom: 8px; 
            display: flex; justify-content: space-between;
        }
        .post-title { 
            font-size: 20px; color: var(--accent); margin-bottom: 10px; font-weight: bold; 
        }
        .post-excerpt { 
            color: var(--text); font-size: 14px; line-height: 1.6;
            display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .read-more-badge {
            display: inline-block; margin-top: 15px; font-size: 12px;
            color: var(--bg); background: var(--text-dim);
            padding: 2px 8px; border-radius: 4px; font-weight: bold;
        }
        .post-card:hover .read-more-badge { background: var(--accent); }

        /* ERROR MESSAGE */
        .error-msg {
            text-align: center; color: #ff3b30; border: 1px solid #ff3b30; 
            padding: 20px; border-radius: 8px; background: rgba(255,59,48,0.1);
        }

        /* LOADING SPINNER (Was missing previously) */
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--surface);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-container">
            <a href="/" class="nav-logo">🛰️ Survey Tools</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/about.html">About</a>
                <a href="/resources.html">Resources</a>
            </div>
        </div>
        <button class="theme-btn" id="themeBtn">🌓</button>
    </nav>

    <div class="blog-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 class="section-title" style="margin: 0;">News & Updates</h1>
            <a href="https://bensurveytools.substack.com/subscribe" target="_blank" class="btn" style="font-size: 12px;">Subscribe ↗</a>
        </div>

        <div id="postsList">
            <div class="loading-spinner" style="display:block; margin: 50px auto;"></div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        const SUBSTACK_URL = 'https://bensurveytools.substack.com'; 
        
        const app = {
            async init() {
                const container = document.getElementById('postsList');
                container.innerHTML = '<div class="loading-spinner" style="display:block; margin: 50px auto;"></div>';
                
                try {
                    // 1. Define the Feed URL
                    const feedUrl = `${SUBSTACK_URL}/feed`;
                    
                    // 2. Use CORSProxy.io (Faster & more reliable than AllOrigins)
                    // We encode the feed URL so it passes correctly
                    const proxyUrl = `https://corsproxy.io/?` + encodeURIComponent(feedUrl);
                    
                    console.log(`Attempting to fetch: ${proxyUrl}`);

                    const res = await fetch(proxyUrl);
                    
                    if (!res.ok) {
                        throw new Error(`Proxy Error: ${res.status} ${res.statusText}`);
                    }

                    const xmlText = await res.text();

                    // 3. Parse the XML
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    
                    // Check for XML parsing errors
                    const parseError = xmlDoc.querySelector("parsererror");
                    if (parseError) {
                        throw new Error("Received invalid XML from Substack");
                    }

                    const items = Array.from(xmlDoc.querySelectorAll("item"));

                    // 4. Handle Empty Feed
                    if (items.length === 0) {
                        container.innerHTML = `
                            <div class="error-msg">
                                <p>Feed loaded but contains 0 items.</p>
                                <p style="font-size:12px; margin-top:5px;">
                                    If you just published your first post, wait 10 minutes for Substack's cache to clear.
                                </p>
                            </div>`;
                        return;
                    }

                    // 5. Render Posts
                    container.innerHTML = items.map(item => {
                        const title = item.querySelector("title").textContent;
                        const link = item.querySelector("link").textContent;
                        const pubDate = item.querySelector("pubDate").textContent;
                        
                        // Extract text snippet from HTML description
                        const descriptionHTML = item.querySelector("description").textContent;
                        const tempDiv = document.createElement("div");
                        tempDiv.innerHTML = descriptionHTML;
                        const textSnippet = tempDiv.textContent || tempDiv.innerText || "";

                        const dateObj = new Date(pubDate);
                        const dateStr = dateObj.toLocaleDateString('en-GB', { 
                            day: 'numeric', month: 'long', year: 'numeric' 
                        });

                        return `
                        <a href="${link}" target="_blank" class="post-card">
                            <div class="post-meta"><span>${dateStr}</span><span>Substack ↗</span></div>
                            <div class="post-title">${title}</div>
                            <div class="post-excerpt">${textSnippet}</div>
                            <span class="read-more-badge">Read Article</span>
                        </a>`;
                    }).join('');

                } catch (e) {
                    console.error("Feed Error:", e);
                    container.innerHTML = `
                        <div class="error-msg">
                            <p><strong>Connection Failed</strong></p>
                            <p style="font-size:12px; margin-bottom:15px;">${e.message}</p>
                            <a href="${SUBSTACK_URL}" target="_blank" class="btn primary" style="display:inline-block;">Visit Blog Directly</a>
                        </div>
                    `;
                }
            }
        };

        app.init();
    </script>
</body>
</html>
