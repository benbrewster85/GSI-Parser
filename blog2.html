<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Tools - News & Updates</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>

    .post-card .read-more-badge[href]:hover {
    border-color: var(--accent) !important;
    color: var(--accent) !important;
    background: transparent !important;
}

    .blog-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    
    /* CATEGORY TABS */
    .filter-container {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
    }
    .filter-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 6px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s ease;
        text-transform: capitalize;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: bold; }

    /* GRID LAYOUT */
    #postsList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 25px;
        transition: opacity 0.3s ease;
    }

    /* CARD STYLING */
    .post-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 25px;
        transition: all 0.2s ease;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        height: 100%;
        cursor: pointer;
    }
    .post-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    
    .post-meta { 
        font-size: 12px; color: var(--text-dim); margin-bottom: 12px; 
        display: flex; justify-content: space-between;
    }
    .post-tags { display: flex; gap: 5px; text-transform: uppercase; font-size: 10px; color: var(--accent); font-weight: bold; }
    .post-title { 
        font-size: 20px; color: var(--accent); margin-bottom: 10px; font-weight: bold; line-height: 1.3;
    }
    .post-excerpt { 
        color: var(--text); font-size: 14px; line-height: 1.6;
        display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
        -webkit-box-orient: vertical; overflow: hidden;
        flex-grow: 1; 
    }
    .read-more-badge {
        display: inline-block; margin-top: 20px; font-size: 12px;
        color: var(--bg); background: var(--text-dim);
        padding: 4px 10px; border-radius: 4px; font-weight: bold;
        align-self: flex-start;
    }
    .post-card:hover .read-more-badge { background: var(--accent); }

    /* FEATURED POST */
    .post-card.featured { grid-column: 1 / -1; border-left: 5px solid var(--accent); }
    .post-card.featured .post-title { font-size: 24px; }

    /* IN-HOUSE SINGLE ARTICLE VIEWER */
    #singleArticleView {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px;
        margin-top: 20px;
    }
    .back-btn {
        background: transparent; border: 1px solid var(--border); color: var(--text);
        padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 25px;
        transition: all 0.2s;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
    
    /* Styled incoming Substack content seamlessly */
    .article-content { color: var(--text); line-height: 1.8; font-size: 16px; }
    .article-content h1, .article-content h2, .article-content h3 { color: var(--accent); margin-top: 1.5em; }
    .article-content p { margin-bottom: 1.2em; }
    .article-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; }
    .article-content a { color: var(--accent); text-decoration: underline; }

    /* PAGINATION & UTILITIES */
    .pagination-container {
        display: flex; justify-content: center; gap: 10px; margin-top: 40px;
        padding-top: 20px; border-top: 1px solid var(--border);
    }
    .page-btn {
        background: var(--surface); border: 1px solid var(--border); color: var(--text);
        padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    .page-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
        text-align: center; color: #ff3b30; border: 1px solid #ff3b30; 
        padding: 20px; border-radius: 8px; background: rgba(255,59,48,0.1); grid-column: 1 / -1;
    }
    .loading-spinner {
        width: 40px; height: 40px; border: 3px solid var(--surface); border-top: 3px solid var(--accent);
        border-radius: 50%; animation: spin 1s linear infinite; margin: 50px auto; grid-column: 1 / -1;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 600px) {
        #postsList { grid-template-columns: 1fr; }
        .post-card.featured .post-title { font-size: 20px; }
        #singleArticleView { padding: 20px; }
    }
</style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-container">
            <a href="/" class="nav-logo">🛰️ Survey Tools</a>
            <button class="mobile-menu-btn" onclick="toggleMenu()" aria-label="Toggle menu">☰</button>
            <div class="nav-links" id="navLinks">
                <a href="/">Home</a>
                <a href="/about.html">About</a>
                <a href="/resources.html">Resources</a>
                <a href="/blog/index.html" class="nav-active">Blog & News</a>
            </div>
        </div>
        <button class="theme-btn" id="themeBtn">🌓</button>
    </nav>

    <div class="blog-container">
        <!-- Main Feed View -->
        <div id="feedView">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>News & Updates</h2>
                <a href="https://bensurveytools.substack.com/subscribe" target="_blank" class="btn" style="font-size: 12px;">Subscribe ↗</a>
            </div>

            <!-- Dynamic Category Filters -->
            <div class="filter-container" id="filterContainer"></div>

            <div id="postsList"></div>
            <div id="paginationControls" class="pagination-container"></div>
        </div>

        <!-- In-House Reader View (Hidden by default) -->
        <div id="singleArticleView" style="display: none;">
            <button class="back-btn" onclick="blogFeed.closeArticle()">&larr; Back to Feed</button>
            <div id="articleTarget"></div>
        </div>
    </div>

    <script src="../js/main.js"></script>

    <script>
        const SUBSTACK_URL = 'https://bensurveytools.substack.com'; 
        
        const blogFeed = {
            state: {
                allPosts: [],
                filteredPosts: [],
                currentPage: 1,
                postsPerPage: 6,
                currentCategory: 'all'
            },

            async init() {
                const container = document.getElementById('postsList');
                container.innerHTML = '<div class="loading-spinner"></div>';
                
                // Using corsproxy.io to bypass CORS without rss2json's strict limits
                const proxy = 'https://corsproxy.io/?';
                const uniqueNum = Math.floor(Math.random() * 10000);
                const sourceUrl = `${SUBSTACK_URL}/feed?cache_bust=${uniqueNum}`;
                
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);

                    const res = await fetch(proxy + encodeURIComponent(sourceUrl), { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    
                    const xmlText = await res.text();
                    
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    
                    const parseError = xmlDoc.getElementsByTagName("parsererror");
                    if (parseError.length > 0) throw new Error("XML Parsing Error");

                    const items = xmlDoc.querySelectorAll("item");
                    if (items.length === 0) throw new Error('No articles found');

                    this.state.allPosts = Array.from(items).map((item, idx) => {
                        // Extract categories/sections set up in Substack
                        const categories = Array.from(item.querySelectorAll("category")).map(c => c.textContent);
                        
                        // Extract full content text from content:encoded namespace natively
                        let fullContent = "";
                        const contentEncoded = item.getElementsByTagNameNS("http://purl.org/rss/1.0/modules/content/", "encoded")[0];
                        if (contentEncoded) {
                            fullContent = contentEncoded.textContent;
                        } else {
                            fullContent = item.querySelector("description")?.textContent || "";
                        }

                        return {
                            id: idx,
                            title: item.querySelector("title")?.textContent || "Untitled",
                            pubDate: item.querySelector("pubDate")?.textContent || new Date().toISOString(),
                            link: item.querySelector("link")?.textContent || "",
                            author: item.querySelector("creator")?.textContent || "Ben",
                            description: item.querySelector("description")?.textContent || "",
                            content: fullContent,
                            categories: categories
                        };
                    });

                    this.state.filteredPosts = this.state.allPosts;
                    this.renderFilters();
                    this.renderPage(1);

                } catch (e) {
                    console.error("Detailed Feed Error Log:", e);
                    container.innerHTML = `
                        <div class="error-msg">
                            <p>Unable to connect to the feed service right now.</p>
                            <p style="font-size:11px; margin-top:5px; color:var(--text-dim);">Reason: ${e.message}</p>
                            <a href="${SUBSTACK_URL}" target="_blank" class="btn primary" style="margin-top:15px; display:inline-block;">Read Blog on Substack ↗</a>
                        </div>
                    `;
                }
            },

            renderFilters() {
    const filterContainer = document.getElementById('filterContainer');
    const categories = new Set(['all']);
    
    this.state.allPosts.forEach(post => {
        if (post.categories) {
            post.categories.forEach(cat => categories.add(cat.toLowerCase()));
        }
    });

    // 🔍 TEMPORARY DEBUG LOG
    console.log("Detected Substack Categories:", Array.from(categories));

    // If 'all' is the only thing here, hide the filter container completely
    if (categories.size <= 1) {
        filterContainer.style.display = 'none';
        return;
    }
    filterContainer.style.display = 'flex'; // Ensure it's visible if items exist

    filterContainer.innerHTML = Array.from(categories).map(cat => `
        <button class="filter-btn ${this.state.currentCategory === cat ? 'active' : ''}" 
                onclick="blogFeed.filterByCategory('${cat}')">
            ${cat}
        </button>
    `).join('');
},

            filterByCategory(category) {
                this.state.currentCategory = category;
                this.renderFilters();
                
                if (category === 'all') {
                    this.state.filteredPosts = this.state.allPosts;
                } else {
                    this.state.filteredPosts = this.state.allPosts.filter(post => 
                        post.categories && post.categories.map(c => c.toLowerCase()).includes(category)
                    );
                }
                this.renderPage(1);
            },

            renderPage(page) {
                this.state.currentPage = page;
                const container = document.getElementById('postsList');
                const paginationContainer = document.getElementById('paginationControls');
                
                const start = (page - 1) * this.state.postsPerPage;
                const end = start + this.state.postsPerPage;
                const paginatedItems = this.state.filteredPosts.slice(start, end);

                container.innerHTML = '';
                if(page > 1) container.scrollIntoView({ behavior: 'smooth' });

                if (paginatedItems.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:var(--text-dim); padding:40px;">No posts found in this category.</p>';
                    paginationContainer.style.display = 'none';
                    return;
                }

                container.innerHTML = paginatedItems.map((post, index) => {
                    const dateObj = new Date(post.pubDate);
                    const dateStr = dateObj.toLocaleDateString('en-GB', { 
                        day: 'numeric', month: 'long', year: 'numeric' 
                    });

                    // Create excerpt out of snippet description
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = post.description;
                    const textSnippet = tempDiv.textContent || tempDiv.innerText || "";

                    const isFeatured = (page === 1 && index === 0 && this.state.currentCategory === 'all');
                    const featuredClass = isFeatured ? 'featured' : '';
                    
                    const tagsStr = post.categories ? post.categories.slice(0, 2).join(', ') : '';

                    return `
<div onclick="blogFeed.openArticle(${post.id})" class="post-card ${featuredClass}">
    <div class="post-meta">
        <span>${dateStr}</span>
        <span class="post-tags">${tagsStr}</span>
    </div>
    <div class="post-title">${post.title}</div>
    <div class="post-excerpt">${textSnippet}</div>
    
    <!-- Action buttons container -->
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <span class="read-more-badge">Read Within Site</span>
        <a href="${post.link}" 
           target="_blank" 
           onclick="event.stopPropagation();" 
           class="read-more-badge" 
           style="background: transparent; border: 1px solid var(--border); color: var(--text-dim); text-decoration: none;">
           Substack ↗
        </a>
    </div>
</div>`;
                }).join('');

                this.renderPagination(paginationContainer);
            },

            renderPagination(container) {
                const totalPages = Math.ceil(this.state.filteredPosts.length / this.state.postsPerPage);
                
                if (totalPages <= 1) {
                    container.style.display = 'none';
                    return;
                }
                container.style.display = 'flex';
                
                let buttonsHtml = `
                    <button class="page-btn" onclick="blogFeed.renderPage(${this.state.currentPage - 1})" ${this.state.currentPage === 1 ? 'disabled' : ''}>
                        &larr; Prev
                    </button>
                `;

                for (let i = 1; i <= totalPages; i++) {
                    buttonsHtml += `
                        <button class="page-btn ${i === this.state.currentPage ? 'active' : ''}" onclick="blogFeed.renderPage(${i})">${i}</button>
                    `;
                }

                buttonsHtml += `
                    <button class="page-btn" onclick="blogFeed.renderPage(${this.state.currentPage + 1})" ${this.state.currentPage === totalPages ? 'disabled' : ''}>
                        Next &rarr;
                    </button>
                `;
                container.innerHTML = buttonsHtml;
            },

            openArticle(id) {
                const post = this.state.allPosts.find(p => p.id === id);
                if (!post) return;

                const dateObj = new Date(post.pubDate);
                const dateStr = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

                document.getElementById('feedView').style.display = 'none';
                const readerView = document.getElementById('singleArticleView');
                const target = document.getElementById('articleTarget');

                target.innerHTML = `
                    <h1 style="color: var(--accent); margin-bottom: 5px;">${post.title}</h1>
                    <div style="font-size: 13px; color: var(--text-dim); margin-bottom: 30px;">Published on ${dateStr} • By ${post.author || 'Ben'}</div>
                    <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 30px;">
                    <div class="article-content">${post.content}</div>
                `;

                readerView.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            closeArticle() {
                document.getElementById('singleArticleView').style.display = 'none';
                document.getElementById('feedView').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        blogFeed.init();
    </script>
</body>
</html>
